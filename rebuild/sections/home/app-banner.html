<section class="app-banner section" data-section="home.appBanner">
  <div class="container">
    <div class="app-banner__panel">
      <div class="app-banner__bg" aria-hidden="true">
        <img src="./assets/images/home/map-contours-featured.svg" alt="" />
      </div>

      <div class="app-banner__copy">
        <p class="app-banner__eyebrow" data-i18n="home.appBanner.eyebrow">The Zyflow app</p>
        <h2 class="app-banner__title" data-i18n-html="home.appBanner.titleHtml">Built for the<br />ride, not a tour desk.</h2>
        <p class="app-banner__body" data-i18n="home.appBanner.body">
          Free navigation for cyclists and e-bike riders. Plan with battery, elevation, chargers, and weather before you leave.
        </p>
        <div class="app-banner__ctas">
          <a class="btn btn--primary" href="https://apps.apple.com/app/zyflow/id6763228086" data-app-modal-open data-i18n="home.appBanner.cta">Download</a>
        </div>
      </div>

      <div class="app-banner__phone" aria-hidden="true">
        <div class="phone phone--banner">
          <div class="phone__bezel">
            <div class="phone__notch"></div>
            <div class="phone__screen phone-ui phone-ui--route">
              <p class="phone-ui__label">Zyflow</p>
              <p class="phone-ui__hero" data-i18n="home.appBanner.phoneTitle">Every stop.</p>
              <div class="phone-ui__chips">
                <span data-i18n="home.appBanner.chips.0">Stays</span>
                <span data-i18n="home.appBanner.chips.1">Coffee</span>
                <span data-i18n="home.appBanner.chips.2">Chargers</span>
              </div>
              <div class="phone-ui__map"></div>
              <p class="phone-ui__foot" data-i18n="home.appBanner.phoneFoot">Free on iOS &amp; Android</p>
            </div>
          </div>
        </div>
      </div>

      <div class="app-banner__polaroid app-banner__polaroid--1 polaroid">
        <img src="./assets/images/home/polaroid-1.jpg" alt="" />
      </div>
      <div class="app-banner__polaroid app-banner__polaroid--2 polaroid">
        <img src="./assets/images/home/forest-boardwalk.jpg" alt="Bike handlebars on a forest boardwalk" />
      </div>
    </div>
  </div>
</section>
