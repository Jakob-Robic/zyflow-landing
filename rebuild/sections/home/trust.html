<section
  class="trust section"
  data-section="home.trust"
  data-carousel-mode="marquee"
  data-carousel-speed="35"
  data-carousel-interval="4200"
>
  <div class="container">
    <div
      class="trust-carousel"
      data-trust-carousel
      aria-roledescription="carousel"
      aria-label="Partners"
    >
      <div class="trust-carousel__viewport">
        <div class="trust-carousel__track" data-trust-track>
          <div class="trust__item" data-trust-slide>
            <img src="./assets/images/partners/mapzs.svg" alt="Mapzs" />
            <p class="trust__meta">
              <span class="motif" aria-hidden="true"></span>
              <span data-i18n="home.trust.one">Regional mapping and route data</span>
            </p>
          </div>
          <div class="trust__item" data-trust-slide>
            <img src="./assets/images/partners/bicikleto.svg" alt="Bicikleto" />
            <p class="trust__meta">
              <span class="motif" aria-hidden="true"></span>
              <span data-i18n="home.trust.two">Local cycling community and rides</span>
            </p>
          </div>
          <div class="trust__item" data-trust-slide>
            <img src="./assets/images/partners/ebike.svg" alt="eBike" />
            <p class="trust__meta">
              <span class="motif" aria-hidden="true"></span>
              <span data-i18n="home.trust.three">E-bike travel and charging insight</span>
            </p>
          </div>
          <div class="trust__item" data-trust-slide>
            <img src="./assets/images/partners/datahub.svg" alt="DataHub" />
            <p class="trust__meta">
              <span class="motif" aria-hidden="true"></span>
              <span data-i18n="home.trust.four">Open mobility data for better plans</span>
            </p>
          </div>
        </div>
      </div>
      <div class="trust-carousel__dots" data-trust-dots hidden></div>
    </div>
  </div>
</section>
